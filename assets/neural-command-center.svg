  .label{font-family:'Courier New',monospace;fill:#00eaff;font-size:16px;font-weight:bold}
  .value{font-family:'Courier New',monospace;fill:#e5edf8;font-size:17px}
  .dots{fill:#54718f;opacity:.7}
 </style>
