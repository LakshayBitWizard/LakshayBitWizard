<g fill="#6deaff" filter="url(#glow)">
 <circle cx="205" cy="185" r="5"/><circle cx="265" cy="220" r="5"/><circle cx="330" cy="160" r="6"/><circle cx="398" cy="208" r="5"/><circle cx="470" cy="250" r="4"/><circle cx="445" cy="325" r="5"/><circle cx="390" cy="385" r="5"/><circle cx="340" cy="455" r="4"/><circle cx="265" cy="420" r="5"/><circle cx="190" cy="390" r="4"/><circle cx="145" cy="320" r="4"/><circle cx="300" cy="315" r="8"><animate attributeName="r" values="6;11;6" dur="2.6s" repeatCount="indefinite"/></circle>
</g>
<g fill="#fff" filter="url(#glow)"><circle cx="235" cy="285" r="2.5"/><circle cx="360" cy="235" r="2.5"/><circle cx="370" cy="350" r="2.5"/><circle cx="235" cy="355" r="2.5"/><circle cx="315" cy="405" r="2.5"/></g>
