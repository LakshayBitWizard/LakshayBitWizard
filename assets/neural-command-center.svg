<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
<title id="title">Lakshay Khanna — AI Neural Command Center</title>
<desc id="desc">Animated cyberpunk dashboard with a glowing neural network, system profile, and technology focus areas.</desc>
<defs>
