<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Lakshay Khanna | AI and Full-Stack Developer</title>
<desc id="desc">A polished dark portfolio banner with an illuminated neural network orb, clear developer introduction, featured engineering projects, focus areas and contact links.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset=".58" stop-color="#0a1425"/><stop offset="1" stop-color="#11112b"/></linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#39d5ff"/><stop offset=".52" stop-color="#6b8cff"/><stop offset="1" stop-color="#b28aff"/></linearGradient>
 <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#35e5ff"/><stop offset=".5" stop-color="#3987ff"/><stop offset="1" stop-color="#b36bff"/></linearGradient>
 <radialGradient id="orbGlow"><stop stop-color="#278fff" stop-opacity=".3"/><stop offset=".7" stop-color="#275aff" stop-opacity=".09"/><stop offset="1" stop-color="#07111f" stop-opacity="0"/></radialGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#14243a" stop-opacity=".96"/><stop offset="1" stop-color="#0a1424" stop-opacity=".98"/></linearGradient>
 <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="18"/></filter>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#426080" stroke-opacity=".12"/></pattern>
 <clipPath id="orbClip"><circle cx="300" cy="315" r="190"/></clipPath>
 <style>
  .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
  .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
  .white{fill:#f1f6ff}.muted{fill:#9aacc4}.cyan{fill:#55ddff}.lav{fill:#c4a6ff}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:2.2px}
  .section{font-size:12px;font-weight:700;letter-spacing:1.6px;fill:#7fe4ff}
  .body{font-size:15px;fill:#d8e4f5}
  .sub{font-size:13px;fill:#a9bad1}
  .chip{font-size:12px;font-weight:600;fill:#c9dcf4}
 </style>
</defs>

<!-- Background -->
<rect width="1200" height="620" rx="24" fill="url(#bg)"/>
<rect width="1200" height="620" rx="24" fill="url(#grid)"/>
<circle cx="285" cy="305" r="280" fill="#1462b8" opacity=".12" filter="url(#soft)"/>
<circle cx="1020" cy="170" r="260" fill="#7040bd" opacity=".08" filter="url(#soft)"/>
<rect x="1" y="1" width="1198" height="618" rx="23" fill="none" stroke="#263b58" stroke-width="1.5"/>

<!-- Header -->
<text x="42" y="48" class="mono cyan" font-size="13" font-weight="700">LK</text>
<text x="73" y="48" class="sans white" font-size="14" font-weight="700" letter-spacing=".8">LAKSHAY KHANNA</text>
<text x="226" y="48" class="sans muted" font-size="13">/ AI ENGINEERING PORTFOLIO</text>
<circle cx="1004" cy="43" r="4.5" fill="#40e5ae"><animate attributeName="opacity" values="1;.35;1" dur="2.4s" repeatCount="indefinite"/></circle>
