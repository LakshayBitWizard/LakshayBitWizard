 <rect x="47" y="184" width="124" height="34" rx="17" fill="#0d2035" stroke="#315b83"/><circle cx="64" cy="201" r="4" fill="#4de2ff"/><text x="77" y="205" class="chip">MACHINE LEARNING</text>
 <rect x="430" y="184" width="132" height="34" rx="17" fill="#0d2035" stroke="#315b83"/><circle cx="447" cy="201" r="4" fill="#a78bfa"/><text x="460" y="205" class="chip">FULL-STACK</text>
 <rect x="53" y="438" width="112" height="34" rx="17" fill="#0d2035" stroke="#315b83"/><circle cx="70" cy="455" r="4" fill="#a78bfa"/><text x="83" y="459" class="chip">DEVSECOPS</text>
 <rect x="423" y="438" width="139" height="34" rx="17" fill="#0d2035" stroke="#315b83"/><circle cx="440" cy="455" r="4" fill="#4de2ff"/><text x="453" y="459" class="chip">AGENTIC AI</text>
</g>
<text x="300" y="548" text-anchor="middle" class="mono muted" font-size="11" letter-spacing="2">LEARN  /  DESIGN  /  DEPLOY</text>

