<circle cx="300" cy="315" r="4" fill="#fff" filter="url(#glow)"><animateMotion dur="9s" repeatCount="indefinite" path="M0,-215 A215,82 -24 1,1 0,215 A215,82 -24 1,1 0,-215"/></circle>
