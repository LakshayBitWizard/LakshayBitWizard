  <filter id="neon" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#1a4261" stroke-opacity=".25" stroke-width="1"/></pattern>
  <clipPath id="panel"><rect x="16" y="16" width="1368" height="488" rx="22"/></clipPath>
