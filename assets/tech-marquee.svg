<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 124" width="100%" height="124" role="img" aria-label="Scrolling Tech Stack Marquee">
  <defs>
    <linearGradient id="edgeFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="black" />
      <stop offset="10%" stop-color="white" />
      <stop offset="90%" stop-color="white" />
      <stop offset="100%" stop-color="black" />
    </linearGradient>
    <mask id="fadeMask">
      <rect x="0" y="0" width="900" height="124" fill="url(#edgeFade)" />
    </mask>
    <linearGradient id="pillBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2128" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30363d" />
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.55" />
    </linearGradient>
    <style>
      .label {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 600;
        fill: #f0f6fc;
        dominant-baseline: central;
      }
      .sub {
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 9.5px;
        fill: #8b949e;
        dominant-baseline: central;
      }
      .pill {
        fill: url(#pillBg);
        stroke: url(#neonBorder);
        stroke-width: 1.25;
        rx: 10;
        ry: 10;
      }
      .row1 {
        animation: scrollLeft 24s linear infinite;
      }
      .row2 {
        animation: scrollRight 26s linear infinite;
      }
      .pulse {
        animation: pulseDot 2.4s ease-in-out infinite;
      }
      @keyframes scrollLeft {
        0% { transform: translateX(0px); }
        100% { transform: translateX(-1408px); }
      }
      @keyframes scrollRight {
        0% { transform: translateX(-1408px); }
        100% { transform: translateX(0px); }
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.45; }
      }
    </style>
  </defs>

  <g mask="url(#fadeMask)">
    <!-- Row 1: AI, Agents & Security (scrolls left) -->
    <g transform="translate(0, 10)">
      <g class="row1">
        <!-- Set A (8 items * 176px = 1408px) -->
        <g transform="translate(0, 0)"><rect class="pill" width="160" height="44"/><circle class="pulse" cx="20" cy="22" r="5" fill="#00f0ff"/><text class="label" x="34" y="16">LangGraph</text><text class="sub" x="34" y="31">Multi-Agent</text></g>
        <g transform="translate(176, 0)"><rect class="pill" width="160" height="44"/><circle class="pulse" cx="20" cy="22" r="5" fill="#ee4c2c"/><text class="label" x="34" y="16">PyTorch 2.0</text><text class="sub" x="34" y="31">Deep Learning</text></g>
        <g transform="translate(352, 0)"><rect class="pill" width="160" height="44"/><circle class="pulse" cx="20" cy="22" r="5" fill="#10b981"/><text class="label" x="34" y="16">Semgrep SAST</text><text class="sub" x="34" y="31">Static Rules</text></g>
        <g transform="translate(528, 0)"><rect class="pill" width="160" height="44"/><circle class="pulse" cx="20" cy="22" r="5" fill="#3776ab"/><text class="label" x="34" y="16">LibCST AST</text><text class="sub" x="34" y="31">Auto-Fixer</text></g>
        <g transform="translate(704, 0)"><rect class="pill" width="160" height="44"/><circle class="pulse" cx="20" cy="22" r="5" fill="#ff6600"/><text class="label" x="34" y="16">ChromaDB</text><text class="sub" x="34" y="31">Vector RAG</text></g>
        <g transform="translate(880, 0)"><rect class="pill" width="160" height="44"/><circle class="pulse" cx="20" cy="22" r="5" fill="#f55036"/><text class="label" x="34" y="16">Groq LPU</text><text class="sub" x="34" y="31">Fast Inference</text></g>
        <g transform="translate(1056, 0)"><rect class="pill" width="160" height="44"/><circle class="pulse" cx="20" cy="22" r="5" fill="#a855f7"/><text class="label" x="34" y="16">Scapy NIDS</text><text class="sub" x="34" y="31">Packet Engine</text></g>
        <g transform="translate(1232, 0)"><rect class="pill" width="160" height="44"/><circle class="pulse" cx="20" cy="22" r="5" fill="#f7931e"/><text class="label" x="34" y="16">Scikit-Learn</text><text class="sub" x="34" y="31">ML Pipelines</text></g>
        <!-- Set B (seamless duplicate) -->
        <g transform="translate(1408, 0)"><rect class="pill" width="160" height="44"/><circle class="pulse" cx="20" cy="22" r="5" fill="#00f0ff"/><text class="label" x="34" y="16">LangGraph</text><text class="sub" x="34" y="31">Multi-Agent</text></g>
        <g transform="translate(1584, 0)"><rect class="pill" width="160" height="44"/><circle class="pulse" cx="20" cy="22" r="5" fill="#ee4c2c"/><text class="label" x="34" y="16">PyTorch 2.0</text><text class="sub" x="34" y="31">Deep Learning</text></g>
        <g transform="translate(1760, 0)"><rect class="pill" width="160" height="44"/><circle class="pulse" cx="20" cy="22" r="5" fill="#10b981"/><text class="label" x="34" y="16">Semgrep SAST</text><text class="sub" x="34" y="31">Static Rules</text></g>
        <g transform="translate(1936, 0)"><rect class="pill" width="160" height="44"/><circle class="pulse" cx="20" cy="22" r="5" fill="#3776ab"/><text class="label" x="34" y="16">LibCST AST</text><text class="sub" x="34" y="31">Auto-Fixer</text></g>
        <g transform="translate(2112, 0)"><rect class="pill" width="160" height="44"/><circle class="pulse" cx="20" cy="22" r="5" fill="#ff6600"/><text class="label" x="34" y="16">ChromaDB</text><text class="sub" x="34" y="31">Vector RAG</text></g>
        <g transform="translate(2288, 0)"><rect class="pill" width="160" height="44"/><circle class="pulse" cx="20" cy="22" r="5" fill="#f55036"/><text class="label" x="34" y="16">Groq LPU</text><text class="sub" x="34" y="31">Fast Inference</text></g>
        <g transform="translate(2464, 0)"><rect class="pill" width="160" height="44"/><circle class="pulse" cx="20" cy="22" r="5" fill="#a855f7"/><text class="label" x="34" y="16">Scapy NIDS</text><text class="sub" x="34" y="31">Packet Engine</text></g>
        <g transform="translate(2640, 0)"><rect class="pill" width="160" height="44"/><circle class="pulse" cx="20" cy="22" r="5" fill="#f7931e"/><text class="label" x="34" y="16">Scikit-Learn</text><text class="sub" x="34" y="31">ML Pipelines</text></g>
      </g>
    </g>

    <!-- Row 2: Full-Stack, Cloud & Core (scrolls right) -->
    <g transform="translate(0, 68)">
      <g class="row2">
        <!-- Set A -->
        <g transform="translate(0, 0)"><rect class="pill" width="160" height="44"/><circle class="pulse" cx="20" cy="22" r="5" fill="#009688"/><text class="label" x="34" y="16">FastAPI</text><text class="sub" x="34" y="31">Async APIs</text></g>
        <g transform="translate(176, 0)"><rect class="pill" width="160" height="44"/><circle class="pulse" cx="20" cy="22" r="5" fill="#ffffff"/><text class="label" x="34" y="16">Next.js 14</text><text class="sub" x="34" y="31">App Router</text></g>
        <g transform="translate(352, 0)"><rect class="pill" width="160" height="44"/><circle class="pulse" cx="20" cy="22" r="5" fill="#61dafb"/><text class="label" x="34" y="16">React 18 + TS</text><text class="sub" x="34" y="31">Type-Safe UI</text></g>
        <g transform="translate(528, 0)"><rect class="pill" width="160" height="44"/><circle class="pulse" cx="20" cy="22" r="5" fill="#2ead33"/><text class="label" x="34" y="16">Playwright</text><text class="sub" x="34" y="31">Automation</text></g>
        <g transform="translate(704, 0)"><rect class="pill" width="160" height="44"/><circle class="pulse" cx="20" cy="22" r="5" fill="#3ecf8e"/><text class="label" x="34" y="16">PostgreSQL</text><text class="sub" x="34" y="31">Supabase DB</text></g>
        <g transform="translate(880, 0)"><rect class="pill" width="160" height="44"/><circle class="pulse" cx="20" cy="22" r="5" fill="#2496ed"/><text class="label" x="34" y="16">Docker</text><text class="sub" x="34" y="31">Containers</text></g>
        <g transform="translate(1056, 0)"><rect class="pill" width="160" height="44"/><circle class="pulse" cx="20" cy="22" r="5" fill="#44b78b"/><text class="label" x="34" y="16">Django 5</text><text class="sub" x="34" y="31">REST Backend</text></g>
        <g transform="translate(1232, 0)"><rect class="pill" width="160" height="44"/><circle class="pulse" cx="20" cy="22" r="5" fill="#46e3b7"/><text class="label" x="34" y="16">Vercel / Render</text><text class="sub" x="34" y="31">Cloud Deploy</text></g>
        <!-- Set B (seamless duplicate) -->
        <g transform="translate(1408, 0)"><rect class="pill" width="160" height="44"/><circle class="pulse" cx="20" cy="22" r="5" fill="#009688"/><text class="label" x="34" y="16">FastAPI</text><text class="sub" x="34" y="31">Async APIs</text></g>
        <g transform="translate(1584, 0)"><rect class="pill" width="160" height="44"/><circle class="pulse" cx="20" cy="22" r="5" fill="#ffffff"/><text class="label" x="34" y="16">Next.js 14</text><text class="sub" x="34" y="31">App Router</text></g>
        <g transform="translate(1760, 0)"><rect class="pill" width="160" height="44"/><circle class="pulse" cx="20" cy="22" r="5" fill="#61dafb"/><text class="label" x="34" y="16">React 18 + TS</text><text class="sub" x="34" y="31">Type-Safe UI</text></g>
        <g transform="translate(1936, 0)"><rect class="pill" width="160" height="44"/><circle class="pulse" cx="20" cy="22" r="5" fill="#2ead33"/><text class="label" x="34" y="16">Playwright</text><text class="sub" x="34" y="31">Automation</text></g>
        <g transform="translate(2112, 0)"><rect class="pill" width="160" height="44"/><circle class="pulse" cx="20" cy="22" r="5" fill="#3ecf8e"/><text class="label" x="34" y="16">PostgreSQL</text><text class="sub" x="34" y="31">Supabase DB</text></g>
        <g transform="translate(2288, 0)"><rect class="pill" width="160" height="44"/><circle class="pulse" cx="20" cy="22" r="5" fill="#2496ed"/><text class="label" x="34" y="16">Docker</text><text class="sub" x="34" y="31">Containers</text></g>
        <g transform="translate(2464, 0)"><rect class="pill" width="160" height="44"/><circle class="pulse" cx="20" cy="22" r="5" fill="#44b78b"/><text class="label" x="34" y="16">Django 5</text><text class="sub" x="34" y="31">REST Backend</text></g>
        <g transform="translate(2640, 0)"><rect class="pill" width="160" height="44"/><circle class="pulse" cx="20" cy="22" r="5" fill="#46e3b7"/><text class="label" x="34" y="16">Vercel / Render</text><text class="sub" x="34" y="31">Cloud Deploy</text></g>
      </g>
    </g>
  </g>
</svg>