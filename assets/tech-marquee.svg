<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 116" width="100%" height="116" role="img" aria-label="Scrolling Tech Stack Marquee">
  <defs>
    <linearGradient id="edgeFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="black" />
      <stop offset="8%" stop-color="white" />
      <stop offset="92%" stop-color="white" />
      <stop offset="100%" stop-color="black" />
    </linearGradient>
    <mask id="fadeMask">
      <rect x="0" y="0" width="900" height="116" fill="url(#edgeFade)" />
    </mask>
    <linearGradient id="pillBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <style>
      .label {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 600;
        fill: #e6edf3;
        dominant-baseline: central;
      }
      .pill {
        fill: url(#pillBg);
        stroke: #30363d;
        stroke-width: 1.2;
        rx: 10;
        ry: 10;
      }
      .row1 {
        animation: scrollLeft 26s linear infinite;
      }
      .row2 {
        animation: scrollRight 28s linear infinite;
      }
      @keyframes scrollLeft {
        0% { transform: translateX(0px); }
        100% { transform: translateX(-1328px); }
      }
      @keyframes scrollRight {
        0% { transform: translateX(-1328px); }
        100% { transform: translateX(0px); }
      }
    </style>
  </defs>

  <g mask="url(#fadeMask)">
    <!-- Row 1: AI, Agents & Security (scrolls left) -->
    <g class="row1" transform="translate(0, 12)">
      <!-- Set A -->
      <g transform="translate(0, 0)"><rect class="pill" width="150" height="38"/><circle cx="20" cy="19" r="5" fill="#00f0ff"/><text class="label" x="34" y="19">LangGraph</text></g>
      <g transform="translate(166, 0)"><rect class="pill" width="150" height="38"/><circle cx="20" cy="19" r="5" fill="#ee4c2c"/><text class="label" x="34" y="19">PyTorch 2.0</text></g>
      <g transform="translate(332, 0)"><rect class="pill" width="150" height="38"/><circle cx="20" cy="19" r="5" fill="#10b981"/><text class="label" x="34" y="19">Semgrep SAST</text></g>
      <g transform="translate(498, 0)"><rect class="pill" width="150" height="38"/><circle cx="20" cy="19" r="5" fill="#3776ab"/><text class="label" x="34" y="19">LibCST AST</text></g>
      <g transform="translate(664, 0)"><rect class="pill" width="150" height="38"/><circle cx="20" cy="19" r="5" fill="#ff6600"/><text class="label" x="34" y="19">ChromaDB RAG</text></g>
      <g transform="translate(830, 0)"><rect class="pill" width="150" height="38"/><circle cx="20" cy="19" r="5" fill="#f55036"/><text class="label" x="34" y="19">Groq LPU</text></g>
      <g transform="translate(996, 0)"><rect class="pill" width="150" height="38"/><circle cx="20" cy="19" r="5" fill="#a855f7"/><text class="label" x="34" y="19">Scapy NIDS</text></g>
      <g transform="translate(1162, 0)"><rect class="pill" width="150" height="38"/><circle cx="20" cy="19" r="5" fill="#f7931e"/><text class="label" x="34" y="19">Scikit-Learn</text></g>
      <!-- Set B (seamless duplicate) -->
      <g transform="translate(1328, 0)"><rect class="pill" width="150" height="38"/><circle cx="20" cy="19" r="5" fill="#00f0ff"/><text class="label" x="34" y="19">LangGraph</text></g>
      <g transform="translate(1494, 0)"><rect class="pill" width="150" height="38"/><circle cx="20" cy="19" r="5" fill="#ee4c2c"/><text class="label" x="34" y="19">PyTorch 2.0</text></g>
      <g transform="translate(1660, 0)"><rect class="pill" width="150" height="38"/><circle cx="20" cy="19" r="5" fill="#10b981"/><text class="label" x="34" y="19">Semgrep SAST</text></g>
      <g transform="translate(1826, 0)"><rect class="pill" width="150" height="38"/><circle cx="20" cy="19" r="5" fill="#3776ab"/><text class="label" x="34" y="19">LibCST AST</text></g>
      <g transform="translate(1992, 0)"><rect class="pill" width="150" height="38"/><circle cx="20" cy="19" r="5" fill="#ff6600"/><text class="label" x="34" y="19">ChromaDB RAG</text></g>
      <g transform="translate(2158, 0)"><rect class="pill" width="150" height="38"/><circle cx="20" cy="19" r="5" fill="#f55036"/><text class="label" x="34" y="19">Groq LPU</text></g>
      <g transform="translate(2324, 0)"><rect class="pill" width="150" height="38"/><circle cx="20" cy="19" r="5" fill="#a855f7"/><text class="label" x="34" y="19">Scapy NIDS</text></g>
      <g transform="translate(2490, 0)"><rect class="pill" width="150" height="38"/><circle cx="20" cy="19" r="5" fill="#f7931e"/><text class="label" x="34" y="19">Scikit-Learn</text></g>
    </g>

    <!-- Row 2: Full-Stack, Cloud & Core (scrolls right) -->
    <g class="row2" transform="translate(0, 64)">
      <!-- Set A -->
      <g transform="translate(0, 0)"><rect class="pill" width="150" height="38"/><circle cx="20" cy="19" r="5" fill="#009688"/><text class="label" x="34" y="19">FastAPI</text></g>
      <g transform="translate(166, 0)"><rect class="pill" width="150" height="38"/><circle cx="20" cy="19" r="5" fill="#ffffff"/><text class="label" x="34" y="19">Next.js 14</text></g>
      <g transform="translate(332, 0)"><rect class="pill" width="150" height="38"/><circle cx="20" cy="19" r="5" fill="#61dafb"/><text class="label" x="34" y="19">React 18 + TS</text></g>
      <g transform="translate(498, 0)"><rect class="pill" width="150" height="38"/><circle cx="20" cy="19" r="5" fill="#2ead33"/><text class="label" x="34" y="19">Playwright</text></g>
      <g transform="translate(664, 0)"><rect class="pill" width="150" height="38"/><circle cx="20" cy="19" r="5" fill="#3ecf8e"/><text class="label" x="34" y="19">PostgreSQL</text></g>
      <g transform="translate(830, 0)"><rect class="pill" width="150" height="38"/><circle cx="20" cy="19" r="5" fill="#2496ed"/><text class="label" x="34" y="19">Docker</text></g>
      <g transform="translate(996, 0)"><rect class="pill" width="150" height="38"/><circle cx="20" cy="19" r="5" fill="#092e20"/><text class="label" x="34" y="19">Django 5</text></g>
      <g transform="translate(1162, 0)"><rect class="pill" width="150" height="38"/><circle cx="20" cy="19" r="5" fill="#46e3b7"/><text class="label" x="34" y="19">Vercel / Render</text></g>
      <!-- Set B (seamless duplicate) -->
      <g transform="translate(1328, 0)"><rect class="pill" width="150" height="38"/><circle cx="20" cy="19" r="5" fill="#009688"/><text class="label" x="34" y="19">FastAPI</text></g>
      <g transform="translate(1494, 0)"><rect class="pill" width="150" height="38"/><circle cx="20" cy="19" r="5" fill="#ffffff"/><text class="label" x="34" y="19">Next.js 14</text></g>
      <g transform="translate(1660, 0)"><rect class="pill" width="150" height="38"/><circle cx="20" cy="19" r="5" fill="#61dafb"/><text class="label" x="34" y="19">React 18 + TS</text></g>
      <g transform="translate(1826, 0)"><rect class="pill" width="150" height="38"/><circle cx="20" cy="19" r="5" fill="#2ead33"/><text class="label" x="34" y="19">Playwright</text></g>
      <g transform="translate(1992, 0)"><rect class="pill" width="150" height="38"/><circle cx="20" cy="19" r="5" fill="#3ecf8e"/><text class="label" x="34" y="19">PostgreSQL</text></g>
      <g transform="translate(2158, 0)"><rect class="pill" width="150" height="38"/><circle cx="20" cy="19" r="5" fill="#2496ed"/><text class="label" x="34" y="19">Docker</text></g>
      <g transform="translate(2324, 0)"><rect class="pill" width="150" height="38"/><circle cx="20" cy="19" r="5" fill="#092e20"/><text class="label" x="34" y="19">Django 5</text></g>
      <g transform="translate(2490, 0)"><rect class="pill" width="150" height="38"/><circle cx="20" cy="19" r="5" fill="#46e3b7"/><text class="label" x="34" y="19">Vercel / Render</text></g>
    </g>
  </g>
</svg>